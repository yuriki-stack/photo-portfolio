<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="YU PHOTOGRAPHY — 日常の中にある、ふと心に残る瞬間を。">
  <title>YU PHOTOGRAPHY</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Noto+Sans+JP:wght@300;400;500&family=Playfair+Display:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero" id="top">
    <nav class="nav">
      <a href="#top" class="logo"><strong>YU</strong><span>PHOTOGRAPHY</span></a>
      <button class="menu-toggle" aria-label="メニューを開く" aria-expanded="false">☰</button>
      <div class="nav-links"><a href="#gallery">Gallery</a><a href="#about">About</a></div>
    </nav>
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <p class="eyebrow">PHOTO PORTFOLIO</p>
      <h1>Moments<br><em>in ordinary life.</em></h1>
      <p class="hero-copy">日常の中にある、ふと心に残る瞬間を。</p>
      <a href="#gallery" class="explore">Explore Gallery <span>↓</span></a>
    </div>
  </header>

  <main>
    <section class="gallery-section" id="gallery">
      <div class="section-heading"><p class="eyebrow">SELECTED WORKS</p><h2>Gallery</h2></div>
      <div class="filters" id="filters"></div>
      <div class="gallery-grid" id="gallery-grid" aria-live="polite"></div>
    </section>

    <section class="about" id="about">
      <div>
        <p class="eyebrow">ABOUT</p>
        <h2>日常を、少し特別に。</h2>
        <p>何気ない日常の中には、心が動く瞬間がたくさんあります。<br>その一瞬を写真に残し、そっとお届けします。</p>
      </div>
      <div class="about-links"><a href="mailto:your-email@example.com">Email <span>↗</span></a><a href="#top">Back to top <span>↑</span></a></div>
    </section>
  </main>

  <div class="modal" id="photo-modal" aria-hidden="true" role="dialog" aria-modal="true" aria-label="写真詳細">
    <button class="modal-close" aria-label="閉じる">×</button>
    <button class="modal-nav prev" aria-label="前の写真">←</button>
    <div class="modal-inner">
      <img id="modal-image" src="" alt="">
      <div class="photo-info">
        <p class="eyebrow" id="modal-category"></p>
        <h2 id="modal-title"></h2>
        <div class="meta"><span id="modal-date"></span><span id="modal-location"></span></div>
        <p id="modal-note"></p>
      </div>
    </div>
    <button class="modal-nav next" aria-label="次の写真">→</button>
  </div>

  <footer>© YU PHOTOGRAPHY</footer>
  <script src="script.js"></script>
</body>
</html>
